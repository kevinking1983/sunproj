name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Apps and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspaces --if-present
      - run: npm run lint -w @ration/mobile
      - run: npm run lint -w @ration/rider
      - run: npm run lint -w @ration/web
      - run: npm run lint -w @ration/admin
      - run: npm run build -w @ration/web
      - run: npm run build -w @ration/admin
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  functions:
    name: Edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - working-directory: supabase/functions
        run: deno check place-order/index.ts verify-payment/index.ts razorpay-webhook/index.ts cancel-order/index.ts send-sms/index.ts notify-order/index.ts

  database:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Stub Supabase-managed schema
        run: |
          createdb -T template0 ration
          psql -v ON_ERROR_STOP=1 -d ration <<'SQL'
          create schema extensions; create schema auth;
          create table auth.users (id uuid primary key default gen_random_uuid(), phone text);
          create function auth.uid() returns uuid language sql stable as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          create role anon nologin; create role authenticated nologin; create role service_role nologin bypassrls;
          grant usage on schema public, extensions to anon, authenticated, service_role;
          create publication supabase_realtime;
          SQL
      - name: Catalog data is valid and the seed is up to date
        run: |
          node scripts/catalog/build-seed.mjs
          git diff --exit-code -- supabase/seeds/catalog.sql || (echo "supabase/seeds/catalog.sql is stale: run node scripts/catalog/build-seed.mjs and commit it" && exit 1)
      - name: Apply migrations and seed
        run: |
          for f in supabase/migrations/*.sql; do echo "== $f"; psql -v ON_ERROR_STOP=1 -d ration -f "$f"; done
          psql -v ON_ERROR_STOP=1 -d ration -f supabase/seed.sql
          psql -v ON_ERROR_STOP=1 -d ration -f supabase/seeds/catalog.sql
      - name: Smoke
        run: psql -v ON_ERROR_STOP=1 -d ration -f supabase/tests/smoke.sql

  e2e:
    name: End-to-end on the open-source stack
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the open-source stack (Supabase, mock gateway, edge functions)
        run: node scripts/oss-start.mjs
      - name: Probe auth and functions directly
        run: |
          set -a; . ./.oss.env; set +a
          echo "== OTP request for the test number =="
          curl -s -o /tmp/otp.json -w 'HTTP %{http_code}\n' -X POST "$SUPABASE_URL/auth/v1/otp" -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{"phone":"919999900001"}'
          cat /tmp/otp.json; echo
          echo "== functions runtime =="
          curl -s -o /dev/null -w 'place-order HTTP %{http_code}\n' -X POST "$SUPABASE_URL/functions/v1/place-order" -H "apikey: $SUPABASE_ANON_KEY" -d '{}'
          docker ps --format '{{.Names}}'
      - name: Build and start the website
        run: |
          npm run build -w @ration/web
          (cd apps/web && nohup npx next start -p 3000 > ../../.web.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/terms >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:3000/terms >/dev/null
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Run end-to-end tests
        run: npx playwright test
      - name: Show service logs on failure
        if: failure()
        run: |
          echo "== edge functions =="; tail -n 100 .oss-functions.log || true
          echo "== website =="; tail -n 60 .web.log || true
          echo "== mock gateway =="; docker logs ration-mock-gateway --tail 60 || true
          echo "== supabase auth =="; docker logs supabase_auth_ration --tail 80 2>&1 || true
          echo "== supabase edge runtime =="; docker logs supabase_edge_runtime_ration --tail 80 2>&1 || true
          echo "== notify-order calls from the database =="; docker exec supabase_db_ration psql -U postgres -c "select id, status_code, error_msg, left(content::text, 200) from net._http_response order by id desc limit 10" 2>&1 || true
          echo "== test error context =="; cat test-results/*/error-context.md 2>/dev/null | head -150 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            test-results
            playwright-report
            .oss-functions.log
            .web.log
          if-no-files-found: ignore
