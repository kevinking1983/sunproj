name: Catalog photos

# Looks up openly licensed product photos (Wikimedia Commons, Open Food/Beauty/Products Facts)
# for the catalog, takes the links pasted into supabase/catalog/photo-links.csv, and commits
# images.json, image-overrides.json and the regenerated seed to main.
# Needs open internet, which is why it runs here rather than on a developer machine.
on:
  workflow_dispatch:
    inputs:
      retry_misses:
        description: "Try again for products where no photo was found before"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "supabase/catalog/products/**"
      - "supabase/catalog/pinned.json"
      - "scripts/catalog/resolve-images.mjs"
      - "supabase/catalog/photo-links.csv"
      - "scripts/photos/import-links.mjs"

permissions:
  contents: write

concurrency:
  group: catalog-photos
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look up photos
        run: node scripts/catalog/resolve-images.mjs --max-minutes 110 ${{ inputs.retry_misses && '--retry-misses' || '' }}
      - name: Photos from links in photo-links.csv
        run: node scripts/photos/import-links.mjs
      - name: List products still without a photo in photo-links.csv
        run: node scripts/photos/import-links.mjs --template
      - name: Regenerate the catalog seed and the image tracker
        run: |
          node scripts/catalog/build-seed.mjs
          node scripts/catalog/image-tracker.mjs
      - name: Commit results
        run: |
          git config user.name "ration-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/catalog/images.json supabase/catalog/image-overrides.json supabase/catalog/photo-links.csv supabase/seeds/catalog.sql supabase/catalog/image-tracker.csv supabase/catalog/family-classification.csv supabase/catalog/IMAGE_COVERAGE.md
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Catalog: licensed product photos and regenerated seed"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              # Keep the app and web branches on the same commit when they have not moved on.
              git push origin HEAD:app HEAD:web || echo "app/web have other commits; not updated"
              exit 0
            fi
            sleep 5
          done
          exit 1
